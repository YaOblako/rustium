<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Менеджер паролей - Rustium</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      user-select: none;
    }

    :root {
      --md-surface-lowest: #0e1215;
      --md-surface-low: #151a1d;
      --md-surface: #1b2125;
      --md-surface-high: #242c30;
      --md-surface-highest: #2e363c;

      --md-primary: #a8c7fa;
      --md-on-primary: #003258;
      --md-primary-container: #00497d;
      --md-on-primary-container: #d3e3fd;

      --md-secondary-container: #3c4858;
      --md-on-secondary-container: #d7e3f8;

      --md-on-surface: #e1e3e5;
      --md-on-surface-variant: #c1c7ce;
      --md-error: #ff897d;

      --radius-pill: 9999px;
      --radius-card: 16px;
      --radius-dialog: 24px;
      --radius-tab: 10px;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--md-surface-lowest);
      color: var(--md-on-surface);
      min-height: 100vh;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--md-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-title svg {
      width: 32px;
      height: 32px;
    }

    .actions-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .md3-button {
      height: 38px;
      padding: 0 18px;
      border-radius: var(--radius-pill);
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .md3-button:hover {
      background: var(--md-surface-highest);
      color: var(--md-on-surface);
      transform: translateY(-1px);
    }
    .md3-button:active {
      transform: scale(0.97);
    }
    .md3-button.primary {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .md3-button.primary:hover {
      background: #c2e7ff;
    }

    /* Search Bar */
    .search-box {
      width: 100%;
      background: var(--md-surface);
      border-radius: var(--radius-pill);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .search-box svg {
      width: 20px;
      height: 20px;
      color: var(--md-on-surface-variant);
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: transparent;
      color: var(--md-on-surface);
      font-size: 14px;
      font-weight: 400;
      user-select: text;
    }
    .search-input::placeholder {
      color: var(--md-on-surface-variant);
      opacity: 0.7;
    }

    /* Passwords List */
    .passwords-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pwd-card {
      background: var(--md-surface);
      border-radius: var(--radius-card);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .pwd-card:hover {
      background: var(--md-surface-high);
      transform: translateY(-1px);
    }

    .pwd-site-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-pill);
      background: var(--md-surface-highest);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-primary);
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }
    .pwd-site-icon svg {
      width: 22px;
      height: 22px;
    }

    .pwd-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .pwd-url {
      font-size: 15px;
      font-weight: 600;
      color: var(--md-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pwd-meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--md-on-surface-variant);
      flex-wrap: wrap;
    }

    .pwd-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--md-surface-low);
      padding: 4px 10px;
      border-radius: var(--radius-tab);
    }
    .pwd-field-label {
      font-size: 11px;
      color: var(--md-on-surface-variant);
    }
    .pwd-field-value {
      font-family: monospace;
      color: var(--md-on-surface);
      user-select: text;
    }

    .icon-action-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      cursor: pointer;
      color: var(--md-on-surface-variant);
      transition: background 0.12s, color 0.12s;
    }
    .icon-action-btn:hover {
      background: var(--md-surface-highest);
      color: var(--md-on-surface);
    }
    .icon-action-btn svg {
      width: 14px;
      height: 14px;
    }

    .pwd-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .delete-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--md-on-surface-variant);
      transition: background 0.15s, color 0.15s;
    }
    .delete-btn:hover {
      background: rgba(255, 137, 125, 0.15);
      color: var(--md-error);
    }
    .delete-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Empty State */
    .empty-state {
      background: var(--md-surface);
      border-radius: var(--radius-card);
      padding: 48px;
      text-align: center;
      color: var(--md-on-surface-variant);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-pill);
      background: var(--md-surface-low);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-primary);
    }
    .empty-icon svg {
      width: 32px;
      height: 32px;
    }

    /* Modal Dialog */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-card {
      background: var(--md-surface-high);
      border-radius: var(--radius-dialog);
      padding: 28px;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--md-on-surface);
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-label {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      font-weight: 500;
    }
    .modal-input {
      background: var(--md-surface-low);
      color: var(--md-on-surface);
      padding: 10px 14px;
      border-radius: var(--radius-tab);
      font-size: 14px;
      user-select: text;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: var(--md-surface-highest);
      color: var(--md-on-surface);
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 3000;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-row">
      <div class="page-title">
        <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="currentColor"/></svg>
        Менеджер паролей
      </div>
      <div class="actions-bar">
        <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="importCsv(event)">
        <div class="md3-button" onclick="document.getElementById('csvFileInput').click()">
          Импорт из CSV
        </div>
        <div class="md3-button primary" onclick="openAddModal()">
          Добавить пароль
        </div>
      </div>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по сохраненным сайтам или логинам..." oninput="filterPasswords()">
    </div>

    <!-- Passwords List -->
    <div class="passwords-list" id="passwordsList">
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/></svg>
        </div>
        <div style="font-size:16px; font-weight:600; color:var(--md-on-surface);">Нет сохраненных паролей</div>
        <div style="font-size:13px; max-width:440px; line-height:1.5;">
          Вы можете нажать <strong>«Импорт из CSV»</strong> для переноса паролей из Chrome, Firefox или Edge, либо нажать <strong>«Добавить пароль»</strong>.
        </div>
      </div>
    </div>
  </div>

  <!-- Add Password Modal -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal-card">
      <div class="modal-title">Добавить учетные данные</div>
      <div class="input-group">
        <label class="input-label">Веб-сайт или URL</label>
        <input type="text" class="modal-input" id="modalUrl" placeholder="https://example.com" spellcheck="false">
      </div>
      <div class="input-group">
        <label class="input-label">Имя пользователя или Email</label>
        <input type="text" class="modal-input" id="modalUsername" placeholder="user@example.com" spellcheck="false">
      </div>
      <div class="input-group">
        <label class="input-label">Пароль</label>
        <input type="text" class="modal-input" id="modalPassword" placeholder="Ваш пароль" spellcheck="false">
      </div>
      <div class="modal-actions">
        <div class="md3-button" onclick="closeAddModal()">Отмена</div>
        <div class="md3-button primary" onclick="submitAddPassword()">Сохранить</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allLogins = [];
    const revealedPasswords = new Set();

    function sendIpc(msg) {
      if (window.ipc) window.ipc.postMessage(JSON.stringify(msg));
    }

    function showToast(text) {
      const t = document.getElementById("toast");
      t.textContent = text;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2000);
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(label + " скопирован в буфер обмена");
      });
    }

    function toggleRevealPassword(id) {
      if (revealedPasswords.has(id)) {
        revealedPasswords.delete(id);
      } else {
        revealedPasswords.add(id);
      }
      renderPasswords(allLogins);
    }

    function deleteLogin(id) {
      sendIpc({ action: "delete_login", id: id });
      showToast("Учетная запись удалена");
    }

    function openAddModal() {
      document.getElementById("modalUrl").value = "";
      document.getElementById("modalUsername").value = "";
      document.getElementById("modalPassword").value = "";
      document.getElementById("addModal").classList.add("show");
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("show");
    }

    function submitAddPassword() {
      const url = document.getElementById("modalUrl").value.trim();
      const username = document.getElementById("modalUsername").value.trim();
      const password = document.getElementById("modalPassword").value.trim();

      if (!url) {
        alert("Пожалуйста, введите адрес сайта");
        return;
      }

      sendIpc({
        action: "add_login",
        url: url,
        username: username,
        password: password
      });

      closeAddModal();
      showToast("Пароль успешно сохранен");
    }

    function importCsv(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        sendIpc({
          action: "import_passwords",
          csv_content: evt.target.result
        });
        showToast("Импорт паролей выполнен");
      };
      reader.readAsText(file);
    }

    function filterPasswords() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!q) {
        renderPasswords(allLogins);
        return;
      }
      const filtered = allLogins.filter(l =>
        l.url.toLowerCase().includes(q) || l.username.toLowerCase().includes(q)
      );
      renderPasswords(filtered);
    }

    function getDomainInitial(urlStr) {
      try {
        const u = new URL(urlStr.startsWith("http") ? urlStr : "https://" + urlStr);
        const host = u.hostname.replace(/^www\./, "");
        return host.charAt(0).toUpperCase() || "P";
      } catch(e) {
        return urlStr.charAt(0).toUpperCase() || "P";
      }
    }

    function renderPasswords(items) {
      const container = document.getElementById("passwordsList");
      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/></svg>
            </div>
            <div style="font-size:16px; font-weight:600; color:var(--md-on-surface);">Пароли не найдены</div>
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      items.forEach(item => {
        const isRevealed = revealedPasswords.has(item.id);
        const displayPassword = isRevealed ? item.password : "••••••••";
        const initial = getDomainInitial(item.url);

        const card = document.createElement("div");
        card.className = "pwd-card";
        card.innerHTML = `
          <div class="pwd-site-icon">${initial}</div>
          <div class="pwd-info">
            <div class="pwd-url">${item.url}</div>
            <div class="pwd-meta-row">
              <div class="pwd-field">
                <span class="pwd-field-label">Логин:</span>
                <span class="pwd-field-value">${item.username || "—"}</span>
                <div class="icon-action-btn" title="Копировать логин" onclick="copyToClipboard('${item.username}', 'Логин')">
                  <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="currentColor"/></svg>
                </div>
              </div>
              <div class="pwd-field">
                <span class="pwd-field-label">Пароль:</span>
                <span class="pwd-field-value">${displayPassword}</span>
                <div class="icon-action-btn" title="${isRevealed ? 'Скрыть пароль' : 'Показать пароль'}" onclick="toggleRevealPassword(${item.id})">
                  <svg viewBox="0 0 24 24"><path d="${isRevealed ? 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z' : 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z'}" fill="currentColor"/></svg>
                </div>
                <div class="icon-action-btn" title="Копировать пароль" onclick="copyToClipboard('${item.password}', 'Пароль')">
                  <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="currentColor"/></svg>
                </div>
              </div>
            </div>
          </div>
          <div class="pwd-card-actions">
            <div class="delete-btn" title="Удалить пароль" onclick="deleteLogin(${item.id})">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.__rustium_render_passwords__ = function(logins) {
      allLogins = logins || [];
      filterPasswords();
    };

    window.addEventListener("DOMContentLoaded", () => {
      sendIpc({ action: "get_state" });
    });
  </script>
</body>
</html>
