<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Предупреждение о безопасности - Rustium</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      user-select: none;
    }
    :root {
      --md-surface-lowest: #0e1215;
      --md-surface-low: #151a1d;
      --md-surface: #1b2125;
      --md-surface-high: #242c30;
      --md-surface-highest: #2e363c;
      --md-error: #f2b8b5;
      --md-error-container: #8c1d18;
      --md-on-error-container: #f9dedc;
      --md-primary: #a8c7fa;
      --md-on-primary: #003258;
      --md-on-surface: #e1e3e5;
      --md-on-surface-variant: #c1c7ce;
      --radius-pill: 9999px;
      --radius-card: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--md-surface-lowest);
      color: var(--md-on-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .warning-card {
      background: var(--md-surface);
      border-radius: var(--radius-card);
      padding: 36px 32px;
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
    }
    .shield-icon {
      width: 72px;
      height: 72px;
      background: var(--md-error-container);
      color: var(--md-on-error-container);
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .shield-icon svg {
      width: 40px;
      height: 40px;
    }
    .warning-title {
      font-size: 24px;
      font-weight: 700;
      color: #ff897d;
      line-height: 1.3;
    }
    .warning-domain {
      font-size: 14px;
      font-weight: 600;
      background: var(--md-surface-highest);
      color: var(--md-on-surface);
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      word-break: break-all;
    }
    .warning-desc {
      font-size: 14px;
      color: var(--md-on-surface-variant);
      line-height: 1.6;
    }
    .actions-row {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 160px;
      padding: 14px 20px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-safe {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .btn-unsafe {
      background: var(--md-surface-highest);
      color: var(--md-on-surface-variant);
    }
    .btn-unsafe:hover {
      color: #ff897d;
    }
  </style>
</head>
<body>
  <div class="warning-card">
    <div class="shield-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/></svg>
    </div>
    <div class="warning-title">Подозрение на скам или фишинг</div>
    <div class="warning-domain" id="blockedDomain">Загрузка адреса...</div>
    <div class="warning-desc">
      Встроенная защита <strong>uBlock Origin Badware & Phishing Protection</strong> в Rustium заблокировала переход на этот веб-сайт, так как он обнаружен в глобальных списках вредоносных, фишинговых и мошеннических ресурсов.
    </div>
    <div class="actions-row">
      <button class="btn btn-safe" id="goBackBtn">Вернуться в безопасность (Рекомендуется)</button>
      <button class="btn btn-unsafe" id="proceedBtn">Все равно перейти</button>
    </div>
  </div>

  <script>
    function sendIpc(payload) {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify(payload));
      }
    }

    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("target") || window.location.hash.slice(1) || "";
    try {
      const u = new URL(targetUrl);
      document.getElementById("blockedDomain").textContent = u.hostname || targetUrl;
    } catch(e) {
      document.getElementById("blockedDomain").textContent = targetUrl || "Вредоносный сайт";
    }

    document.getElementById("goBackBtn").onclick = () => {
      sendIpc({ action: "navigate", url: "rustium://newtab" });
    };

    document.getElementById("proceedBtn").onclick = () => {
      if (targetUrl) {
        sendIpc({ action: "navigate", url: targetUrl });
      }
    };
  </script>
</body>
</html>
