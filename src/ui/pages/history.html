<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>История - Rustium</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      user-select: none;
    }

    :root {
      --md-surface-lowest: #0f1416;
      --md-surface-low: #171d1e;
      --md-surface: #1b2123;
      --md-surface-high: #252b2d;
      --md-surface-highest: #303638;

      --md-primary: #a8c7fa;
      --md-on-primary: #003258;
      --md-primary-container: #00497d;
      --md-on-primary-container: #d3e3fd;

      --md-on-surface: #e1e3e5;
      --md-on-surface-variant: #c1c7ce;
      --radius-pill: 9999px;
      --radius-card: 16px;
      --radius-tab: 12px;

      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    body {
      background: var(--md-surface-lowest);
      color: var(--md-on-surface);
      min-height: 100vh;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--md-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .md3-button {
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-pill);
      background: var(--md-surface-highest);
      color: var(--md-on-surface);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .md3-button:hover {
      background: #cf6679;
      color: #000;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: var(--md-surface);
      border-radius: var(--radius-tab);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .history-item:hover {
      background: var(--md-surface-high);
    }

    .history-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .history-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--md-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-url {
      font-size: 12px;
      color: var(--md-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-time {
      font-size: 11px;
      color: var(--md-on-surface-variant);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-row">
      <div class="page-title">
        <span>🕒</span> История просмотров
      </div>
      <div class="md3-button" onclick="clearHist()">
        <span>🗑️</span> Очистить историю
      </div>
    </div>

    <div class="history-list" id="historyList">
      <!-- Items dynamically populated -->
    </div>
  </div>

  <script>
    function clearHist() {
      if (confirm("Вы уверены, что хотите удалить всю историю просмотров?")) {
        if (window.ipc) {
          window.ipc.postMessage(JSON.stringify({ action: "clear_history" }));
        }
      }
    }

    function navTo(url) {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ action: "navigate", url: url }));
      } else {
        window.location.href = url;
      }
    }

    window.__rustium_render_history__ = function(items) {
      const container = document.getElementById("historyList");
      if (!items || items.length === 0) {
        container.innerHTML = `
          <div style="background:var(--md-surface); border-radius:16px; padding:32px; text-align:center; color:var(--md-on-surface-variant);">
            История просмотров пуста.
          </div>`;
        return;
      }

      container.innerHTML = "";
      items.forEach(h => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.onclick = () => navTo(h.url);
        item.innerHTML = `
          <div class="history-info">
            <div class="history-title">${h.title || h.url}</div>
            <div class="history-url">${h.url}</div>
          </div>
          <div class="history-time">${h.visit_time || ''}</div>
        `;
        container.appendChild(item);
      });
    };
  </script>
</body>
</html>
