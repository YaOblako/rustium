<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Загрузки - Rustium 1.1.1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      user-select: none;
    }

    :root {
      --md-surface-lowest: #0f1416;
      --md-surface-low: #171d1e;
      --md-surface: #1b2123;
      --md-surface-high: #252b2d;
      --md-surface-highest: #303638;

      --md-primary: #a8c7fa;
      --md-on-primary: #003258;
      --md-primary-container: #00497d;
      --md-on-primary-container: #d3e3fd;

      --md-secondary-container: #3c4858;
      --md-on-secondary-container: #d7e3f8;

      --md-on-surface: #e1e3e5;
      --md-on-surface-variant: #c1c7ce;
      --radius-pill: 9999px;
      --radius-card: 16px;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--md-surface-lowest);
      color: var(--md-on-surface);
      min-height: 100vh;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--md-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-title svg {
      width: 28px;
      height: 28px;
    }

    .actions-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .md3-button {
      height: 38px;
      padding: 0 18px;
      border-radius: var(--radius-pill);
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .md3-button:hover {
      background: var(--md-surface-highest);
      color: var(--md-on-surface);
      transform: translateY(-1px);
    }
    .md3-button.primary {
      background: var(--md-primary);
      color: var(--md-on-primary);
      font-weight: 600;
    }
    .md3-button.primary:hover {
      background: #c2e7ff;
    }
    .md3-button.danger {
      background: #8c1d18;
      color: #f9dedc;
    }

    .downloads-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .download-card {
      background: var(--md-surface);
      border-radius: var(--radius-card);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background 0.15s ease;
    }
    .download-card:hover {
      background: var(--md-surface-high);
    }

    .dl-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .dl-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .dl-filename {
      font-size: 15px;
      font-weight: 600;
      color: var(--md-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dl-meta {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .threads-badge {
      background: var(--md-surface-highest);
      color: var(--md-primary);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 11px;
    }

    .dl-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--md-surface-highest);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--md-primary);
      border-radius: var(--radius-pill);
      transition: width 0.2s ease;
    }

    .empty-state {
      background: var(--md-surface);
      border-radius: var(--radius-card);
      padding: 48px;
      text-align: center;
      color: var(--md-on-surface-variant);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-row">
      <div class="page-title">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/></svg>
        Менеджер загрузок
      </div>
      <div class="actions-bar">
        <div class="md3-button" onclick="triggerTestDownload()">
          Тестовая загрузка 10 МБ
        </div>
        <div class="md3-button primary" onclick="openFolder()">
          Открыть папку
        </div>
      </div>
    </div>

    <div class="downloads-list" id="downloadsList">
      <div class="empty-state">
        <div>Загрузок пока нет. Скачиваемые файлы будут отображаться здесь с информацией о скорости и количестве потоков.</div>
      </div>
    </div>
  </div>

  <script>
    function sendIpc(msg) {
      if (window.ipc) window.ipc.postMessage(JSON.stringify(msg));
    }

    function openFolder() {
      sendIpc({ action: "open_downloads_folder" });
    }

    function triggerTestDownload() {
      sendIpc({
        action: "start_download",
        url: "https://proof.ovh.net/files/10Mb.dat",
        filename: "rustium_multithread_test_10mb.dat"
      });
    }

    function pauseDl(id) {
      sendIpc({ action: "pause_download", id: id });
    }

    function resumeDl(id) {
      sendIpc({ action: "resume_download", id: id });
    }

    function cancelDl(id) {
      sendIpc({ action: "cancel_download", id: id });
    }

    function openFile(id) {
      sendIpc({ action: "open_download_file", id: id });
    }

    function showInFolder(id) {
      sendIpc({ action: "show_in_folder", id: id });
    }

    window.__rustium_render_downloads__ = function(items) {
      const container = document.getElementById("downloadsList");
      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div>Загрузок пока нет.</div>
          </div>`;
        return;
      }

      container.innerHTML = "";
      items.forEach(dl => {
        const card = document.createElement("div");
        card.className = "download-card";

        const mbDownloaded = (dl.downloaded_bytes / (1024 * 1024)).toFixed(1);
        const mbTotal = dl.total_bytes > 0 ? (dl.total_bytes / (1024 * 1024)).toFixed(1) + " МБ" : "Размер неизвестен";
        const mbSpeed = (dl.speed_bytes_per_sec / (1024 * 1024)).toFixed(2) + " МБ/с";

        let statusText = "Загрузка...";
        if (dl.status === "Completed") statusText = "Завершено";
        else if (dl.status === "Paused") statusText = "Пауза";
        else if (typeof dl.status === "object" && dl.status.Failed) statusText = "Ошибка: " + dl.status.Failed;
        else if (dl.status === "Failed") statusText = "Отменено";

        const threadsLabel = dl.supports_ranges && dl.threads_used > 1
          ? `Многопоточно: ${dl.threads_used} потоков`
          : `Один поток`;

        let actionsHtml = "";
        if (dl.status === "Downloading") {
          actionsHtml = `
            <div class="md3-button" onclick="pauseDl('${dl.id}')">Пауза</div>
            <div class="md3-button danger" onclick="cancelDl('${dl.id}')">Отменить</div>
          `;
        } else if (dl.status === "Paused") {
          actionsHtml = `
            <div class="md3-button primary" onclick="resumeDl('${dl.id}')">Возобновить</div>
            <div class="md3-button danger" onclick="cancelDl('${dl.id}')">Отменить</div>
          `;
        } else if (dl.status === "Completed") {
          actionsHtml = `
            <div class="md3-button primary" onclick="openFile('${dl.id}')">Открыть файл</div>
            <div class="md3-button" onclick="showInFolder('${dl.id}')">Показать в папке</div>
          `;
        }

        card.innerHTML = `
          <div class="dl-main-row">
            <div class="dl-info">
              <div class="dl-filename">${dl.filename}</div>
              <div class="dl-meta">
                <span>${mbDownloaded} МБ из ${mbTotal}</span>
                <span>•</span>
                <span style="color:var(--md-primary); font-weight:600;">${dl.status === "Downloading" ? mbSpeed : statusText}</span>
                <span>•</span>
                <span class="threads-badge">${threadsLabel}</span>
              </div>
            </div>
            <div class="dl-actions">
              ${actionsHtml}
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-bar" style="width: ${dl.progress_percent}%;"></div>
          </div>
        `;
        container.appendChild(card);
      });
    };
  </script>
</body>
</html>
