[package]
name = "rustium"
version = "1.2.0"
edition = "2021"
authors = ["YaOblako <https://github.com/YaOblako>", "Google Gemini <gemini@google.com>"]
description = "Современный и безопасный веб-браузер на Rust в стиле Material Design 3"
license = "MIT OR Apache-2.0"
readme = "README.md"
default-run = "rustium"

[dependencies]
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
adblock = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
url = "2.5"
futures-util = "0.3"
tokio-util = "0.7"
uuid = { version = "1.16", features = ["v4"] }
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

[build-dependencies]
winres = "0.1"
